name: Update profile widgets

on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-widgets.yml'
      - '.github/profile-3d-settings.json'
      - '.github/scripts/render-3d.cjs'

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Download pinned 3D renderer
        run: |
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/yoshi389111/github-profile-3d-contrib/9e3f937195cf840d364388973f73e3c4b3753586/dist/index.js' \
            --output "$RUNNER_TEMP/profile-3d-renderer.cjs"

      - name: Render public calendar with anonymous private contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/render-3d.cjs --renderer "$RUNNER_TEMP/profile-3d-renderer.cjs"

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&card_width=440&custom_title=GitHub%20Stats&bg_color=0d1117&title_color=8fcbd3&text_color=c9d1d9&icon_color=74b7c7&border_color=30363d&disable_animations=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: '2.1.3'
          fail_on_error: 'true'

      - name: Generate language card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&card_width=350&langs_count=6&custom_title=Public%20Repo%20Languages&bg_color=0d1117&title_color=8fcbd3&text_color=c9d1d9&border_color=30363d&disable_animations=true
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: '2.1.3'
          fail_on_error: 'true'

      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update profile widgets'
            git push
          fi
