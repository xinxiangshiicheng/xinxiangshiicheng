name: Update profile widgets

on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-widgets.yml'
      - '.github/profile-3d-settings.json'
      - '.github/scripts/render-3d.cjs'
      - '.github/scripts/render-cards.mjs'

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Download pinned 3D renderer
        run: |
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/yoshi389111/github-profile-3d-contrib/9e3f937195cf840d364388973f73e3c4b3753586/dist/index.js' \
            --output "$RUNNER_TEMP/profile-3d-renderer.cjs"

      - name: Render public calendar with anonymous private contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/render-3d.cjs --renderer "$RUNNER_TEMP/profile-3d-renderer.cjs" --metadata "$RUNNER_TEMP/profile-public-data.json"

      - name: Install pinned card renderer
        run: npm install --prefix "$RUNNER_TEMP/profile-card-renderer" --ignore-scripts --no-audit --no-fund @stats-organization/github-readme-stats-core@2.1.3

      - name: Generate stats and language cards
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/render-cards.mjs "$RUNNER_TEMP/profile-public-data.json" "$RUNNER_TEMP/profile-card-renderer/node_modules/@stats-organization/github-readme-stats-core"

      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update profile widgets'
            git push
          fi
